<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zod Compare Playground</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <h1>Zod Compare Playground</h1>

      <div class="preset-bar" aria-label="Schema presets">
        <span class="preset-label">Presets</span>
        <button class="preset-button" type="button" data-preset="object-width">
          Object width
        </button>
        <button class="preset-button" type="button" data-preset="optional">
          Optional
        </button>
        <button class="preset-button" type="button" data-preset="union">
          Union
        </button>
        <button class="preset-button" type="button" data-preset="enum-literal">
          Enum literal
        </button>
        <button class="preset-button" type="button" data-preset="record-key">
          Record key
        </button>
        <button class="preset-button" type="button" data-preset="tuple-rest">
          Tuple rest
        </button>
      </div>

      <div class="container">
        <div class="editor-container">
          <h2>Expected</h2>
          <textarea id="schemaA" spellcheck="false">
z.object({
  name: z.string()
})</textarea>
        </div>
        <div class="editor-container">
          <h2>Provided</h2>
          <textarea id="schemaB" spellcheck="false">
z.object({
  name: z.string(),
  other: z.number()
})</textarea>
        </div>
      </div>
      <div class="controls">
        <button id="compareBtn">Compare</button>
      </div>
      <div class="results">
        <div class="result-grid">
          <div class="result-item">
            <strong>isSameType(expected, provided):</strong>
            <span id="isSameTypeResult">-</span>
          </div>
          <div class="result-item">
            <strong>isCompatibleType(expected, provided):</strong>
            <span id="isCompatibleTypeResult">-</span>
            <span class="result-hint">provided &lt;= expected</span>
          </div>
        </div>

        <div class="debug-tabs" role="tablist" aria-label="Debug output">
          <button
            id="sameTab"
            class="debug-tab active"
            type="button"
            role="tab"
            aria-selected="true"
            data-debug-target="same"
          >
            isSameType
          </button>
          <button
            id="compatibleTab"
            class="debug-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-debug-target="compatible"
          >
            isCompatibleType
          </button>
        </div>

        <div id="debug" class="debug-info"></div>
        <div id="error" class="error"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
